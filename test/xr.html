<!doctype html>
<html><head><meta charset="utf-8"><title>Pocket Skies XR emulation test</title></head>
<body style="margin:0">
<style>
  #cap{z-index:2147483646 !important;position:fixed;left:50%;top:22px;transform:translateX(-50%);max-width:80%;padding:10px 22px;border-radius:14px;background:rgba(10,14,30,.74);color:#fff;font:600 26px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;opacity:0;transition:opacity .4s;z-index:20;pointer-events:none}
  #card{z-index:2147483647 !important;position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(255,210,94,.35),transparent 55%),linear-gradient(180deg,#24305e,#121a33);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;opacity:0;transition:opacity .8s;z-index:30;pointer-events:none}
  #card h1{font-size:96px;margin:0}#card h1 span{color:#ffd25e}#card p{font-size:30px;color:#cdd7ff;margin:10px 0}#card .url{font-size:34px;color:#ffd25e;font-weight:700;margin-top:26px}
  .capture #overlay{display:none}
</style>
<div id="cap"></div>
<div id="card"><div><h1>Pocket <span>Skies</span></h1><p>You are the weather.</p><p>Hands-first · Seated · Mixed reality on your desk · Sky Spirit assistant</p><div class="url">hexa3.github.io/pocket-skies</div></div></div>
<div id="overlay"><button id="btn-mr" disabled>MR</button><button id="btn-vr" disabled>VR</button><button id="btn-web">web</button></div>
<script type="module">
  // Boots the game inside IWER (Meta's WebXR emulator). ?device=glasses emulates Meta VR Glasses.
  import { XRDevice, metaQuest3, metaVRGlasses } from 'iwer';
  const glasses = new URLSearchParams(location.search).get('device') === 'glasses';
  const device = new XRDevice(glasses ? metaVRGlasses : metaQuest3);
  device.installRuntime({ forceInstall: true });
  device.primaryInputMode = 'hand';
  device.position.set(0, 1.2, 0);
  window.__device = device;
  const room = new URLSearchParams(location.search).get('room');
  if (room) {
    const { SyntheticEnvironmentModule } = await import('@iwer/sem');
    device.installSEM(SyntheticEnvironmentModule);
    await device.sem.loadDefaultEnvironment(room);
    window.__sem = device.sem;
  }
  await import('/src/main.js');
  if (new URLSearchParams(location.search).has('capture')) {
    document.body.classList.add('capture');
    const { makeDirector } = await import('./director.js');
    window.__sfxLog = [];
    window.__makeDirector = () => { window.__director = makeDirector(); };
  }
</script>
</body></html>
