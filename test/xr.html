<!doctype html>
<html><head><meta charset="utf-8"><title>Pocket Skies XR emulation test</title></head>
<body style="margin:0">
<div id="overlay"><button id="btn-mr" disabled>MR</button><button id="btn-vr" disabled>VR</button><button id="btn-web">web</button></div>
<script type="module">
  import { XRDevice, metaQuest3 } from 'iwer';
  const device = new XRDevice(metaQuest3);
  device.installRuntime({ forceInstall: true });
  device.primaryInputMode = 'hand';
  device.position.set(0, 1.2, 0);
  window.__device = device;
  await import('/src/main.js');
</script>
</body></html>
